<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hero Section with Floating Circles</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #f6faff;
      overflow-x: hidden;
    }

    .hero {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 100px 10%;
      overflow: hidden;
    }

    .hero .content {
      max-width: 550px;
      z-index: 2;
    }

    .hero h1 {
      font-size: 3rem;
      font-weight: 800;
      line-height: 1.3;
    }

    .hero h1 span {
      color: #ff6a00;
      border-bottom: 3px solid #ff6a00;
    }

    .hero p {
      margin: 20px 0 30px;
      color: #666;
    }

    .hero .search-box {
      position: relative;
      width: 100%;
      max-width: 450px;
    }

    .hero .search-box input {
      width: 100%;
      padding: 15px 60px 15px 20px;
      border-radius: 50px;
      border: 1px solid #eee;
      box-shadow: 0 5px 20px rgba(0,0,0,0.05);
    }

    .hero .search-box i {
      position: absolute;
      top: 50%;
      right: 20px;
      transform: translateY(-50%);
      font-size: 1.2rem;
      color: #0066a2;
    }

    .hero .visuals {
      position: relative;
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .circle {
      position: absolute;
      border-radius: 50%;
      transition: transform 0.1s linear;
    }

    .circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .circle1 { width: 180px; height: 180px; top: 0; left: 50px; z-index: 1; }
    .circle2 { width: 120px; height: 120px; top: 200px; left: 180px; z-index: 2; }
    .circle3 { width: 160px; height: 160px; top: 100px; right: 60px; z-index: 1; }
    .circle4 { width: 80px; height: 80px; bottom: 60px; left: 30px; z-index: 1; }
    .circle5 {
      width: 60px; height: 60px; top: 180px; right: 220px;
      background: radial-gradient(circle at center, #f9b700, #ff6a00);
    }

    .circle6 {
      width: 100px; height: 100px; top: 10px; right: 50px;
      background: radial-gradient(circle at center, #ff6a00, #f9b700);
    }
  </style>
</head>
<body>

<section class="hero" id="hero-section">
  <div class="content">
    <h1>The Smarter Way <br> to Learn <span>Anything</span></h1>
    <p>Mauris malesuada enim eget blandit gravida. Duis hendrerit cursus turpis, id mollis est rutrum nec.</p>
    <div class="search-box">
      <input type="text" placeholder="Search Class">
      <i class="bi bi-search"></i>
    </div>
  </div>
  <div class="visuals">
    <!-- Circular images -->
    <div class="circle circle1"><img src="https://via.placeholder.com/180" alt=""></div>
    <div class="circle circle2"><img src="https://via.placeholder.com/120" alt=""></div>
    <div class="circle circle3"><img src="https://via.placeholder.com/160" alt=""></div>
    <div class="circle circle4"><img src="https://via.placeholder.com/80" alt=""></div>

    <!-- Gradient circles -->
    <div class="circle circle5"></div>
    <div class="circle circle6"></div>
  </div>
</section>

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

<script>
  // Mouse parallax effect
  document.addEventListener('mousemove', e => {
    const circles = document.querySelectorAll('.circle');
    const x = e.clientX / window.innerWidth - 0.5;
    const y = e.clientY / window.innerHeight - 0.5;

    circles.forEach((circle, index) => {
      const speed = (index + 1) * 5;
      circle.style.transform = `translate(${x * speed}px, ${y * speed}px)`;
    });
  });
</script>

</body>
</html>
